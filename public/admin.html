<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Kunal Singh Munda</title><meta name="robots" content="noindex">
<style>
body{margin:0;background:#5a7edc url(/bliss.jpg) center/cover fixed;font:13px Tahoma,sans-serif;color:#000}
.win{max-width:820px;margin:24px auto;background:#0054e3;border-radius:8px 8px 0 0;padding:0 3px 3px;box-shadow:2px 3px 12px #0009}
.tb{height:30px;display:flex;align-items:center;padding:0 10px;color:#fff;font:700 13px "Trebuchet MS",sans-serif;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#003dd7);border-radius:8px 8px 0 0;margin:0 -3px}
.body{background:#ece9d8;padding:14px}h2{margin:14px 0 6px;font:700 16px "Trebuchet MS",sans-serif;color:#1c3f94}
input{font:13px Tahoma;padding:4px 6px;border:1px solid #7f9db9}button{font:13px Tahoma;padding:4px 14px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ecebe5 86%,#d8d0c4);cursor:pointer}
.box{background:#fff;border:1px solid #7f9db9;padding:6px 10px;max-height:300px;overflow:auto}.row{border-bottom:1px dotted #aca899;padding:6px 0;white-space:pre-wrap;word-break:break-word}.row small{color:#666}
</style></head><body>
<div class="win"><div class="tb">🔒 Admin</div><div class="body">
<input id="k" type="password" placeholder="Admin key"> <button id="go">Load</button> <span id="err" style="color:#c00"></span>
<h2>Stats</h2><div class="box" id="st">Enter your key.</div>
<h2>Contact messages</h2><div class="box" id="ms"></div>
</div></div>
<script>
const $=s=>document.querySelector(s),k=$("#k");
try{k.value=sessionStorage.getItem("ak")||""}catch(e){}
const rows=(box,items,fn)=>{box.textContent="";if(!items.length){box.textContent="Nothing yet.";return}items.forEach(i=>{const d=document.createElement("div");d.className="row";fn(d,i);box.appendChild(d)})};
async function load(){
 $("#err").textContent="";const key=encodeURIComponent(k.value);
 try{
  const s=await fetch("/api/admin/stats?key="+key);if(!s.ok){$("#err").textContent="Wrong key.";return}
  try{sessionStorage.setItem("ak",k.value)}catch(e){}
  const st=await s.json(),views=Object.entries(st.views||{}).sort((a,b)=>b[1]-a[1]);
  $("#st").textContent="Visitors: "+(st.visits||0)+"\n"+(views.length?views.map(v=>v[0]+": "+v[1]).join("\n"):"No window views yet.");$("#st").style.whiteSpace="pre-wrap";
  const m=await (await fetch("/api/messages?key="+key)).json();
  rows($("#ms"),m.slice().reverse(),(d,x)=>{d.textContent=x.name+" <"+x.email+">\n"+x.message+"\n";const t=document.createElement("small");t.textContent=x.at;d.appendChild(t)});
 }catch(e){$("#err").textContent="Could not reach the server."}
}
$("#go").onclick=load;k.onkeydown=e=>{if(e.key==="Enter")load()};
</script></body></html>
